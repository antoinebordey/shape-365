<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout : appli mobile en une colonne (720 px max), dossard du jour en tête, onglets fixés en bas.
   Monde visuel : piste d'athlétisme (tartan), ligne d'eau de piscine, dossard de course. */
:root {
  --bg: #EDF0EF;
  --surface: #FFFFFF;
  --surface-2: #F4F7F6;
  --ink: #121A1F;
  --ink-2: #4B5A61;
  --ink-3: #6F7D83;
  --line: #D3DADA;
  --accent: #C93C24;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E0D9;
  --pool: #0E6E8C;
  --pool-soft: #D7EBF1;
  --ok: #23934F;
  --ok-ink: #17693A;
  --ok-soft: #DCF0E3;
  --warn: #D99A1E;
  --warn-ink: #8A5A00;
  --warn-soft: #F7E7C4;
  --miss: #E7BDB2;
  --exc: #A3B2C2;
  --cell: #DCE3E3;
  --display: 'Big Shoulders Display', 'Big Shoulders', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1316; --surface: #161D21; --surface-2: #1C252A; --ink: #E6ECEE; --ink-2: #A1B1B7; --ink-3: #7F8F95; --line: #2A363C;
    --accent: #FF6A4B; --accent-ink: #1A0D09; --accent-soft: #3A1E17; --pool: #3DB5D6; --pool-soft: #12303A;
    --ok: #34B66A; --ok-ink: #7BE0A3; --ok-soft: #133524; --warn: #E0A93A; --warn-ink: #F2C46B; --warn-soft: #3A2D10;
    --miss: #5A2C25; --exc: #4F6172; --cell: #243036;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1316; --surface: #161D21; --surface-2: #1C252A; --ink: #E6ECEE; --ink-2: #A1B1B7; --ink-3: #7F8F95; --line: #2A363C;
  --accent: #FF6A4B; --accent-ink: #1A0D09; --accent-soft: #3A1E17; --pool: #3DB5D6; --pool-soft: #12303A;
  --ok: #34B66A; --ok-ink: #7BE0A3; --ok-soft: #133524; --warn: #E0A93A; --warn-ink: #F2C46B; --warn-soft: #3A2D10;
  --miss: #5A2C25; --exc: #4F6172; --cell: #243036;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(96px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--pool); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
input, select { font: inherit; color: var(--ink); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Barre du haut ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
.brand { white-space: nowrap; font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.brand b { color: var(--accent); font-weight: 900; }
.sync { white-space: nowrap; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.cloud::before { background: var(--ok); }

/* ---------- Onglets ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; text-decoration: none; color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.01em; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* ---------- Typo commune ---------- */
.eyebrow { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.h-display { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.95; text-wrap: balance; }
.view-head { padding-block: 6px 14px; display: grid; gap: 6px; }
.view-head h1 { font-family: var(--display); font-weight: 900; font-size: 44px; text-transform: uppercase; line-height: 0.9; letter-spacing: 0.005em; }
.view-head .sub { color: var(--ink-2); font-size: 15px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.stack { display: grid; gap: 16px; }

/* Ligne d'eau : séparateur façon couloir de piscine */
.lane { height: 6px; border-radius: 3px; margin-block: 2px 16px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 14px, var(--surface) 14px 18px, var(--pool) 18px 32px, var(--surface) 32px 36px);
  opacity: 0.85; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card + .card, .card + section, section + .card { margin-top: 16px; }
.card h2 { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; letter-spacing: 0.01em; text-wrap: balance; }
.card h3 { font-size: 17px; font-weight: 700; line-height: 1.25; }

/* ---------- Dossard ---------- */
.bib { position: relative; background: var(--surface); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.bib-band { display: flex; justify-content: space-between; gap: 8px; background: var(--accent); color: var(--accent-ink); padding: 7px 26px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.bib-num { font-family: var(--display); font-weight: 900; font-size: clamp(96px, 30vw, 150px); line-height: 0.82; text-align: center; letter-spacing: 0.01em; padding: 18px 12px 8px; font-variant-numeric: tabular-nums; }
.bib-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 6px 26px 14px; font-weight: 600; font-size: 15px; }
.bib-foot span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); letter-spacing: 0.04em; align-self: center; }
.pin { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-3); background: var(--bg); }
.pin.tl { top: 40px; left: 10px; } .pin.tr { top: 40px; right: 10px; } .pin.bl { bottom: 12px; left: 10px; } .pin.br { bottom: 12px; right: 10px; }
.stamp { position: absolute; right: 18px; top: 46px; font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ok); border: 3px solid var(--ok); border-radius: 6px; padding: 2px 10px; transform: rotate(-9deg); opacity: 0; pointer-events: none; }
.stamp.on { opacity: 0.92; }
.stamp.exc { color: var(--exc); border-color: var(--exc); }
.stamp.in { animation: stamp 520ms cubic-bezier(.2,1.4,.4,1) both; }
@keyframes stamp { from { opacity: 0; transform: rotate(-9deg) scale(1.9); } to { opacity: 0.92; transform: rotate(-9deg) scale(1); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 12px 4px; }
.chip { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.k-force { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.k-run, .chip.k-swim, .chip.k-cond { background: var(--pool-soft); color: var(--pool); border-color: transparent; }
.chip.k-test { background: var(--ink); color: var(--bg); border-color: transparent; }
.banner { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--pool-soft); color: var(--ink); font-size: 15px; }

/* ---------- Validation ---------- */
.checks { margin-top: 14px; }
.chk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.chk { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); min-height: 64px; transition: background-color .18s, border-color .18s; }
.chk b { display: block; font-size: 16px; line-height: 1.2; }
.chk small { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.25; margin-top: 2px; }
.box { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--ink-3); display: grid; place-items: center; color: transparent; background: var(--surface); }
.box svg { width: 18px; height: 18px; }
.chk[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); }
.chk[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk[aria-pressed="true"] small { color: var(--ok-ink); }
.chk:disabled { opacity: 0.55; cursor: not-allowed; }
.mini-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.mini { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.mini::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); }
.mini[aria-pressed="true"] { color: var(--ok-ink); border-color: var(--ok); background: var(--ok-soft); }
.mini[aria-pressed="true"]::before { background: var(--ok); border-color: var(--ok); }
.mini:disabled { opacity: 0.55; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.strip a { display: grid; gap: 3px; justify-items: center; text-decoration: none; color: var(--ink-2); font-family: var(--mono); font-size: 11px; }
.strip a i { width: 100%; max-width: 34px; height: 10px; border-radius: 3px; background: var(--cell); }
.strip a.cur { color: var(--ink); font-weight: 600; }
.strip a.cur i { outline: 2px solid var(--accent); outline-offset: 1px; }
.reward { margin-top: 12px; display: flex; gap: 10px; align-items: center; font-size: 14.5px; }
.reward svg { width: 22px; height: 22px; flex: none; }
.reward.earned { color: var(--ok-ink); font-weight: 700; }
.reward.lost { color: var(--ink-2); }
.linkbtn { margin-top: 12px; font-size: 14px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn[aria-pressed="true"] { color: var(--exc); font-weight: 600; }
.future-note { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

/* statuts (agenda, bandes) */
.st-ok { background: var(--ok) !important; }
.st-part { background: var(--warn) !important; }
.st-miss { background: var(--miss) !important; }
.st-exc { background: var(--exc) !important; }

/* ---------- Séance ---------- */
.sess-head { display: grid; gap: 4px; }
.sess-head .focus { color: var(--ink-2); font-size: 15px; }
.meta { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); letter-spacing: 0.03em; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.fold { margin-top: 14px; border-top: 1px solid var(--line); }
.fold > summary { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 10px; font-weight: 700; }
.fold > summary::after { content: "+"; font-family: var(--mono); font-size: 18px; color: var(--ink-3); }
.fold[open] > summary::after { content: "−"; }
.fold ul.lines { padding-bottom: 6px; }
.blk { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.blk-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.blk-h h3 { font-size: 16px; }
.rounds { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.blk-note { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.ex-list { margin-top: 8px; display: grid; gap: 6px; }
.ex { border-radius: 10px; background: var(--surface-2); }
.ex > summary { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px 10px 10px; }
.tag { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 3px 0; background: var(--surface); }
.ex-n { font-weight: 600; line-height: 1.25; min-width: 0; }
.ex-n small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.ex-d { text-align: right; font-family: var(--mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex-d small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.ex-d.long { white-space: normal; max-width: 46vw; font-size: 12.5px; line-height: 1.3; }
.ex-body { padding: 0 12px 12px 54px; display: grid; gap: 8px; font-size: 14.5px; }
.ex-body ol { list-style: decimal; padding-left: 18px; display: grid; gap: 3px; }
.ex-body .err { color: var(--accent); }
.ex-body .prog { font-size: 13.5px; color: var(--ink-2); }
.ex-body a { font-weight: 600; font-size: 14px; }
.lines { display: grid; gap: 6px; margin-top: 8px; }
.lines li { padding-left: 16px; position: relative; font-size: 15px; }
.lines li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 1px; background: var(--ink-3); }
.swim { display: grid; gap: 6px; margin-top: 8px; counter-reset: sw; }
.swim li { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; background: var(--pool-soft); }
.swim .m { font-family: var(--mono); font-weight: 600; font-size: 14px; color: var(--pool); }
.express p { padding-bottom: 12px; font-size: 15px; }

/* ---------- Repas ---------- */
.meals-head { display: grid; gap: 6px; }
.kcal-big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 0.9; }
.kcal-big small { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 6px; letter-spacing: 0.04em; }
.macro-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
.macro-bar i:nth-child(1) { background: var(--accent); }
.macro-bar i:nth-child(2) { background: var(--pool); }
.macro-bar i:nth-child(3) { background: var(--warn); }
.macro-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.macro-legend b { color: var(--ink); font-weight: 600; }
.macro-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
.notes { margin-top: 12px; display: grid; gap: 6px; }
.notes p { font-size: 14.5px; padding: 9px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); }
.meal { border-top: 1px solid var(--line); }
.meal:first-of-type { margin-top: 12px; }
.meal > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; }
.meal .slot { grid-column: 1 / -1; }
.meal .mn { font-weight: 600; line-height: 1.3; }
.meal .mk { font-family: var(--mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.meal-body { padding-bottom: 14px; display: grid; gap: 10px; }
.ing { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ing td { padding: 5px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.ing td:last-child { text-align: right; font-family: var(--mono); font-size: 13px; white-space: nowrap; padding-left: 12px; color: var(--ink-2); }
.steps { list-style: decimal; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.mm { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.excess { margin-top: 12px; padding: 16px; border-radius: 10px; background: var(--ok-soft); border: 1.5px solid var(--ok); display: grid; gap: 6px; }
.excess .h-display { font-size: 30px; color: var(--ok-ink); }
.excess p { font-size: 15px; }
.excess.locked { background: var(--surface-2); border-color: var(--line); }
.excess.locked .h-display { color: var(--ink-2); }

.tip { margin-top: 16px; padding: 14px 2px 4px; border-top: 2px dashed var(--line); display: grid; gap: 6px; }
.tip p { font-size: 16px; }
.daynav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 20px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink); min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.daynav .btn:last-child { justify-self: end; }

/* ---------- Agenda ---------- */
.cal { display: grid; gap: 4px; }
.cal-row { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)) 28px; gap: 4px; align-items: center; }
.cal-head span { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: center; }
.cal-phase { margin-top: 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.cal-phase::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.wk { text-align: left; font-family: var(--mono); font-size: 12px; font-weight: 600; line-height: 1.1; padding: 3px 4px; border-radius: 6px; }
.wk small { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink-2); }
.cal-row.sel .wk { background: var(--ink); color: var(--bg); }
.cal-row.sel .wk small { color: var(--bg); opacity: 0.75; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--cell); position: relative; }
.cell.today { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.cell.test::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; border: 2px solid var(--ink-3); }
.cell.st-ok.test::after, .cell.st-part.test::after { border-color: rgba(255,255,255,.8); }
.cell.empty { background: transparent; }
.rw { display: grid; place-items: center; color: var(--line); }
.rw svg { width: 20px; height: 20px; }
.rw.earned { color: var(--ok); }
.rw.open { color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--cell); display: inline-block; position: relative; }
.legend i.test::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--ink-3); }
.legend i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.wk-head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.wk-head .btn { padding: 8px 10px; min-height: 40px; }
.wk-days { display: grid; margin-top: 12px; }
.wk-day { display: grid; grid-template-columns: 58px minmax(0, 1fr) 14px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.wk-day .wd { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); line-height: 1.2; }
.wk-day .wd b { display: block; color: var(--ink); font-size: 14px; }
.wk-day .wt { font-weight: 600; line-height: 1.25; min-width: 0; }
.wk-day .wt small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); }
.wk-day .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--cell); }
.wk-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.phasebar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin-top: 12px; position: relative; }
.phasebar i { display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: #fff; letter-spacing: 0.04em; overflow: hidden; white-space: nowrap; }
.ph-reveil { background: var(--pool); } .ph-seche1 { background: var(--accent); } .ph-constr { background: var(--ink-2); } .ph-seche2 { background: color-mix(in srgb, var(--accent) 70%, var(--ink)); } .ph-reveal { background: var(--ok); }
.phasebar .now { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
.phases { display: grid; gap: 12px; margin-top: 14px; }
.phases li { display: grid; grid-template-columns: 12px 1fr; gap: 12px; }
.phases li > i { border-radius: 4px; }
.phases h3 { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1; }
.phases .pmeta { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); margin-block: 3px 4px; }
.phases p { font-size: 15px; }
.rules { display: grid; gap: 10px; margin-top: 10px; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r, decimal-leading-zero); font-family: var(--mono); font-weight: 600; color: var(--accent); font-size: 13px; padding-top: 2px; }

/* ---------- Exercices ---------- */
.equip { display: grid; gap: 2px; margin-top: 8px; }
.eq-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.eq-row b { display: block; }
.eq-row small { color: var(--ink-2); font-size: 13.5px; display: block; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--cell); position: relative; transition: background-color .18s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.kbw { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.field { display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.field input, .field select { padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); min-width: 0; width: 100%; font-size: 16px; }
.fam { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.fam-h { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 12px; align-items: end; }
.fam-h p { color: var(--ink-2); font-size: 14px; }
.ladder { display: grid; gap: 6px; margin-top: 10px; }
.ladder li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14.5px; }
.ladder li > span { font-family: var(--mono); font-weight: 600; color: var(--ink-3); }
.ladder li.cur { background: var(--accent-soft); }
.ladder li.cur > span { color: var(--accent); }
.ladder li.done { opacity: 0.6; }
.ladder small { display: block; color: var(--ink-2); font-size: 13px; }
.lib-group { margin-top: 14px; }
.lib-group h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
.lib .ex > summary { grid-template-columns: minmax(0, 1fr) auto; padding-left: 12px; }
.lib .ex-body { padding-left: 12px; }

/* ---------- Nutrition ---------- */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.seg button { padding: 10px 0; border-radius: 8px; border: 1.5px solid var(--line); font-family: var(--mono); font-size: 13px; font-weight: 600; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tbl-wrap { overflow-x: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px 8px 0; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.tbl td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl tr.cur td { font-weight: 700; }
.shop-cat { margin-top: 14px; }
.shop-cat h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.shop-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.shop-item .q { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); text-align: right; }
.shop-item .bx { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--ink-3); }
.shop-item[aria-pressed="true"] { color: var(--ink-3); text-decoration: line-through; }
.shop-item[aria-pressed="true"] .bx { background: var(--ok); border-color: var(--ok); }
.misc { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.recipes .meal > summary .slot { display: none; }

/* ---------- Suivi ---------- */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 0.95; }
.stat span { font-size: 13.5px; color: var(--ink-2); }
.form-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.chart { margin-top: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-2); font-family: var(--mono); font-size: 10px; }
.chart .target { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.chart .avg { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.chart .pt { fill: var(--accent); opacity: 0.45; }
.chart .last { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
.chart-legend i.t { background: repeating-linear-gradient(90deg, var(--ink-3) 0 4px, transparent 4px 8px); }
.advice { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 8px; font-size: 15px; }
.entries { margin-top: 10px; display: grid; }
.entries li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14.5px; }

      lines('Tests (après 10 min d\'échauffement)', ['Pompes max en une série, forme stricte.', 'Gainage planche max (plafonné à 4 min).', 'Burpees en 3 min.', 'Suspension max à une barre, si tu y as accès.'], 'Note tout dans Suivi > Tests (bloc S0).'),
      lines('Matériel à commander aujourd\'hui', ['Barre de traction de porte (sans vis).', 'Élastiques de traction : lot de 4-5 résistances.', 'Kettlebells 16 kg et 24 kg (la 24 kg peut attendre la semaine 5).', 'Deux chaises solides, ou repère les barres parallèles du parc.']),

    'Courbatures : normal. Douleur vive dans une articulation : on arrête l\'exercice et on prend la version plus facile.',
    'Tes muscles se souviennent de tes années de sport, tes tendons beaucoup moins. C\'est pour ça que le premier mois est volontairement modéré.',

    'Crawl : expire sous l\'eau en continu. Le manque de souffle vient le plus souvent d\'une expiration bloquée.',
    'Batch le dimanche et le mercredi : 1 h de cuisine = 5 repas qui ne demandent aucune volonté.',

    'Ne compense jamais un excès en sautant des repas : reprends simplement le plan au repas suivant.',
    'Dips : descends jusqu\'à l\'angle droit des coudes, pas plus bas au début. Tes épaules te remercieront.',
    'Rowing inversé : ton corps reste une planche. Si les hanches tombent, plie les genoux.',

      session: ses, food: food, tip: tipFor(loc), steps: food.steps };
    cache[gi] = d;
    return d;
  }

  /* ---------- Liste de courses ---------- */
  function shopping(w, s) {
    var agg = {}, misc = {};
    gisOfWeek(w).forEach(function (gi) {
      day(gi, s).food.meals.forEach(function (m) {
        m.items.forEach(function (it) {
          var x = F[it.f];
          if (x[1] + x[2] + x[3] === 0) { var k = x[0] + (it.lab && it.f !== 'citron' && it.f !== 'ail' ? ' : ' + it.lab : ''); misc[it.f === 'epices' || it.f === 'herbes' ? k : x[0]] = 1; return; }
          agg[it.f] = (agg[it.f] || 0) + it.g;
        });
      });
    });
    var groups = {};
    Object.keys(agg).forEach(function (f) { var c = F[f][4]; (groups[c] = groups[c] || []).push({ f: f, name: F[f][0], g: agg[f], q: qtyTxt(f, agg[f]) }); });
    var out = ['pro', 'fec', 'fl', 'cre', 'epi'].filter(function (c) { return groups[c]; }).map(function (c) {
      return { cat: CATS[c], items: groups[c].sort(function (a, b) { return a.name.localeCompare(b.name, 'fr'); }) };
    });
    return { groups: out, misc: Object.keys(misc).sort(function (a, b) { return a.localeCompare(b, 'fr'); }) };
  }

  return {
    DEFAULTS: DEFAULTS, normSettings: normSettings, PHASES: PHASES, RATE: RATE, targetWeight: targetWeight, PREP: PREP, TOTAL: TOTAL,
    locate: locate, giOfDate: giOfDate, gisOfWeek: gisOfWeek, weekStartISO: weekStartISO, day: day, shopping: shopping,
    EX: EX, FAM: FAM, levelOf: levelOf, resolveEx: resolveEx, R: R, F: F, macroOf: macroOf, kcalOf: kcalOf, qtyTxt: qtyTxt, SLOTS: SLOTS,
    addD: addD, diffD: diffD, dowOf: dowOf, todayISO: todayISO, fmtLong: fmtLong, fmtMid: fmtMid, fmtShort: fmtShort, JC: JC, nf: nf, phaseOfWeek: phaseOfWeek
  };
})();

<script>

(function () {

  function obj(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }

  /* ---------- Icônes ---------- */

  };

  /* ---------- État & stockage ---------- */
  var ST = { settings: E.normSettings({}), checks: { days: {} }, log: { weights: {}, measures: {}, tests: {} } };
  var UI = { week: null, foodWeek: null, testBlock: null, confirmReset: 0, stampGi: null, pendingImport: null };
  var Caps = { dl: null };
  // Hors de Claude (ex. GitHub Pages), le navigateur télécharge directement les fichiers.
  var STANDALONE = !(window.claude && typeof window.claude.use === 'function');
  function canSave() { return !!Caps.dl || STANDALONE; }
  function saveFile(filename, data, mime) {
    if (Caps.dl) return Caps.dl.save({ filename: filename, data: data });
    return new Promise(function (res, rej) {

        var blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
        var url = URL.createObjectURL(blob), a = document.createElement('a');

  }
  var LS = 'shape365.v1';
  function normChecks(c) { c = obj(c); return { days: obj(c.days) }; }
  function normLog(l) { l = obj(l); return { weights: obj(l.weights), measures: obj(l.measures), tests: obj(l.tests) }; }
  function lsLoad() { try { var r = JSON.parse(localStorage.getItem(LS) || 'null'); if (r) { ST.settings = E.normSettings(r.settings); ST.checks = normChecks(r.checks); ST.log = normLog(r.log); } } catch (e) { } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) { } }
  function uiGet(k) { try { return JSON.parse(localStorage.getItem('shape365.ui.' + k) || 'null'); } catch (e) { return null; } }
  function uiSet(k, v) { try { localStorage.setItem('shape365.ui.' + k, JSON.stringify(v)); } catch (e) { } }

  var Cloud = { db: null, uid: null, dirty: {}, inflight: {}, again: {}, timers: {}, retry: {} };
  function ref(name) { return Cloud.db.doc('data/users/' + Cloud.uid + '/' + name); }
  function save(name) {
    lsSave();
    if (!Cloud.db) return;

    clearTimeout(Cloud.timers[name]);
    Cloud.timers[name] = setTimeout(function () { flush(name); }, 700);
  }
  function flush(name) {
    if (!Cloud.db) return;
    if (Cloud.inflight[name]) { Cloud.again[name] = true; return; }
    Cloud.inflight[name] = true; Cloud.dirty[name] = false;
    ref(name).set(JSON.parse(JSON.stringify(ST[name]))).then(function () {
      Cloud.inflight[name] = false; Cloud.retry[name] = 0;
      if (Cloud.again[name]) { Cloud.again[name] = false; flush(name); }
    }).catch(function (e) {
      Cloud.inflight[name] = false;
      var code = e && e.code;
      if ((code === 'unavailable' || code === 'resource_exhausted') && (Cloud.retry[name] || 0) < 2) {
        Cloud.retry[name] = (Cloud.retry[name] || 0) + 1;
        setTimeout(function () { flush(name); }, 900 + Math.random() * 900); return;
      }
      if (code === 'quota_exceeded') { toast('Sauvegarde en ligne pleine : tes données restent sur cet appareil.'); return; }
      Cloud.db = null; setSync(); toast('Sauvegarde en ligne indisponible : enregistrement sur cet appareil.');
    });
  }
  function hasContent(name) {
    if (name === 'settings') return JSON.stringify(ST.settings) !== JSON.stringify(E.normSettings({}));
    if (name === 'checks') return Object.keys(ST.checks.days).length > 0;
    return Object.keys(ST.log.weights).length + Object.keys(ST.log.measures).length + Object.keys(ST.log.tests).length > 0;
  }
  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    c.use('downloads').then(function (dl) { if (dl) { Caps.dl = dl; render(true); } }).catch(function () { });
    Promise.all([c.use('user'), c.use('db')]).then(function (r) {
      var user = r[0], db = r[1];
      if (!user || !db) return null;
      return user.id().then(function (uid) {
        if (!uid) return;

          var first = true;
          try {
            ref(name).onSnapshot(function (snap) {
              var wasFirst = first; first = false;

                var data = snap.data();
                var norm = name === 'settings' ? E.normSettings(data) : name === 'checks' ? normChecks(data) : normLog(data);
                if (JSON.stringify(norm) !== JSON.stringify(ST[name])) { ST[name] = norm; lsSave(); render(true); }
              } else if (wasFirst && !snap.metadata.fromCache && hasContent(name)) { flush(name); }
            }, function (err) { if (err && (err.code === 'revoked' || err.code === 'invalid_argument')) { Cloud.db = null; setSync(); } });
          } catch (e) { Cloud.db = null; setSync(); }
        });
      });
    }).catch(function () { });
  }
  function setSync() {
    var el = document.getElementById('sync');
    if (!el) return;
    el.className = 'sync' + (Cloud.db ? ' cloud' : '');
    el.textContent = Cloud.db ? 'Synchronisé' : 'Sur cet appareil';
    el.title = Cloud.db ? 'Cases, poids et réglages enregistrés sur ton compte' : 'Données enregistrées dans ce navigateur';
  }

    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2800);
  }

  /* ---------- Statuts des jours & excès ---------- */
  function chk(iso) { return ST.checks.days[iso] || {}; }
  function okDay(iso) { var c = chk(iso); return !!(c.x || (c.s && c.m)); }
  function status(iso, today) {
    var c = chk(iso); today = today || E.todayISO();

  }

    Object.keys(lg.weights).forEach(function (k) { dates[k] = 1; }); Object.keys(lg.measures).forEach(function (k) { dates[k] = 1; });
    var num = function (v) { return v == null || v === '' ? '' : String(v).replace('.', ','); };
    var rows = [['date', 'poids_kg'].concat(MEAS.map(function (m) { return m[0] + '_cm'; }))];
    Object.keys(dates).sort().forEach(function (d) { var m = lg.measures[d] || {}; rows.push([d, num(lg.weights[d])].concat(MEAS.map(function (x) { return num(m[x[0]]); }))); });
    rows.push([]); rows.push(['test'].concat(Array.from({ length: 14 }, function (_, k) { return 'S' + k * 4; })));
    TESTS.forEach(function (t) { rows.push([t[1]].concat(Array.from({ length: 14 }, function (_, k) { return (lg.tests[k] || {})[t[0]] || ''; }))); });
    var csv = '﻿' + rows.map(function (r) { return r.join(';'); }).join('\r\n');
    saveFile('shape365-suivi.csv', csv, 'text/csv;charset=utf-8').then(function () { toast('Suivi exporté en CSV.'); }).catch(function (e) { if (!e || e.code !== 'declined') toast('Export impossible ici.'); });
  }

  /* ---------- Démarrage ---------- */
  lsLoad();
  render(false);
  connect();
})();
